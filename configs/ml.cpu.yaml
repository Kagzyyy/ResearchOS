# CPU deployment (Hugging Face Spaces, a VPS, anything without a GPU).
#
# Differences from ml.yaml, all forced by having 2 vCPU instead of a 4060:
#   top_k 60 -> 30   the cross-encoder is the bottleneck; halving candidates
#                    roughly halves query time and costs little recall, since
#                    the gold passage is almost always well inside the top 30
#   fp16 -> false    fp16 is a GPU optimisation; on CPU it is slower, not faster
#   port  -> 7860    what Hugging Face Spaces expects
#   host  -> 0.0.0.0 reachable from outside the container
#
# ResearchOS-ML v1 - topic-scoped arXiv corpus.
#
# v1 deliberately ingests a *focused* corpus rather than a thin slice of all of
# cs.LG. A few thousand full-text papers on the topics you actually ask about is
# far more useful on a laptop than 300k abstracts you cannot search deeply.
# Widen `queries` to widen coverage; the cost is ingest time and disk.
seed: 42

ingest:
  # Broad AI coverage, not a topic slice. These are the arXiv categories that
  # hold essentially all AI/ML/DL research.
  queries:
    - 'cat:cs.LG'      # machine learning
    - 'cat:cs.AI'      # artificial intelligence
    - 'cat:cs.CL'      # computation and language (NLP, LLMs)
    - 'cat:cs.CV'      # computer vision
    - 'cat:cs.NE'      # neural and evolutionary computing
    - 'cat:cs.RO'      # robotics
    - 'cat:stat.ML'    # statistics - machine learning
  # Sorted by submission date, so this is the most recent N per category.
  max_results_per_query: 1400
  page_size: 100
  api_delay_seconds: 3.0

  # Abstracts are indexed for everything; full text is capped because PDF
  # download and parsing dominates ingest time (~6s/paper). Papers outside the
  # cap are still searchable by abstract, and any paper looked up by citation
  # gets its full text fetched on demand.
  full_text: true
  max_full_text: 900
  pdf_delay_seconds: 0.5

chunking:
  max_words: 220            # ~290 tokens, fits the 384-token reranker window
  overlap_words: 40
  min_words: 25

retrieval:
  top_k: 30                 # candidates fused before reranking
  bm25:
    k1: 1.5
    b: 0.75
    stemmer: english
  dense:
    model: BAAI/bge-small-en-v1.5
    batch_size: 64
    max_length: 512
    query_prefix: "Represent this sentence for searching relevant passages: "
  fusion:
    rrf_k: 60
  # Rerank the best `first` candidates and stop if their top-5 mean score is
  # already >= tau; otherwise score the rest. Measured (scripts/eval_early_exit.py):
  # recall@10 unchanged, ~23% fewer cross-encoder passes, and the top-5 list is
  # identical to a full rerank for 84% of queries. Raise tau to be more
  # conservative; remove the block to always score every candidate.
  early_exit:
    first: 15
    tau: 0.7

# v1 uses the OFF-THE-SHELF reranker, not a fine-tuned one. The parent project's
# ablation was a null result and most of its gain came from domain adaptation,
# which we cannot do here without labels. Good chunking buys more per hour.
# Phase 2 revisits this once tier-1 citation labels exist.
reranker:
  backend: torch
  model: BAAI/bge-reranker-base
  params: 278M
  max_length: 384
  batch_size: 32
  fp16: false

answer:
  top_k_passages: 6
  max_per_paper: 2          # FR4.2 - force multi-source results
  # US5 rejection. Threshold is on the MEAN of the top-N reranker scores, not
  # the max: one lucky partial match spikes the max (a knee-osteoarthritis query
  # hits 0.67 against a bone-densitometry paper) while the mean stays at 0.19.
  # Scale is [0,1] because CrossEncoder.predict applies a sigmoid. The ONNX
  # backend returns raw logits instead - rescale if you switch.
  # Measured, not eyeballed: scripts/calibrate_gate.py (results/gate_calibration_*.json).
  # The old 0.35 came from a few hand-picked queries ("in-corpus 0.67-0.996") and
  # refused 49% of specific questions whose answer paper WAS retrieved
  # (recall@10 = 100%). Pass rates, specific / vague / off-topic, on the 123k
  # corpus (more papers lift every score, so this was re-measured for it):
  #   0.35 -> 78% / 59% / 15%       0.20 -> 97% / 78% / 25%
  # A wrongly refused good question costs more than an off-topic one let
  # through: the answer prompt still says plainly when passages do not
  # cover the question. Recalibrate whenever the corpus changes size.
  confidence_top_n: 5
  min_mean_score: 0.20
  # Below this (but above min_mean_score) the corpus has *something* but not
  # much, so live arXiv results are added alongside it and the answer draws on
  # both. Above it, a strong corpus hit answers without touching the network.
  # Costs up to citation.live_budget_s when it fires. 0.0 disables it.
  enrich_below: 0.80
  # Live arXiv results are filtered per passage, not on their mean: a keyword
  # search returns a mixed bag, so a few loose hits must not bury the one paper
  # that is the answer. Each live passage must clear this on its own.
  live_min_score: 0.30
  # Groq: free tier, OpenAI-compatible. Model ids change as Groq rotates its
  # catalogue - if you get a decommissioned-model error, change this line.
  # gpt-oss models are REASONING models: hidden reasoning counts against
  # max_tokens, so the budget must be generous or content comes back empty.
  # Groq rotates its catalogue - llama-3.3-70b-versatile was decommissioned.
  # List what you actually have: Groq().models.list()
  # gpt-oss models are REASONING models: hidden reasoning counts against
  # max_tokens, so the budget must be generous or content comes back empty.
  # 20b is ~2x faster than 120b at similar answer quality for this task; swap
  # to openai/gpt-oss-120b if you would rather have depth than speed.
  # Groq rotates its catalogue - list what you have: Groq().models.list()
  model: openai/gpt-oss-20b
  # Each Groq model has its own 200K-token DAILY cap. When the primary's is
  # spent, answers move to these instead of failing for the rest of the day.
  fallback_models: [openai/gpt-oss-120b, qwen/qwen3.8-27b]
  max_tokens: 1300

# Citation lookup: paste a reference you saw in a paper, get it explained.
citation:
  allow_remote: true        # fall back to the arXiv API when not in the corpus
  # Hard wall-clock cap on live arXiv search inside a request. arXiv throttles
  # shared IPs (Hugging Face Spaces) and a throttled call can hang ~50s before
  # failing; past this budget the answer goes out from the corpus instead.
  live_budget_s: 5.0
  # Queried in parallel under the one budget above. OpenAlex adds the
  # conference/journal papers with no arXiv preprint, plus DOI lookup; set
  # OPENALEX_API_KEY for a 10x daily budget (keyless works, ~100 searches/day).
  live_sources: [arxiv, openalex]
  fetch_full_text: true     # download the PDF for on-demand papers
  # Cap the on-demand PDF cache. Citation lookup downloads one PDF per
  # unresolved paper, which grows without bound on a shared deployment.
  # Extracted text is kept regardless - it is ~1% of the size.
  max_pdf_cache_gb: 5.0
  max_tokens: 1500

server:
  host: 0.0.0.0
  api_port: 7860
  ui_port: 7900

paths:
  # v3: v1's 8,330 full-text papers + 114,622 harvested abstracts (2024-01 ..
  # 2025-09) - scripts/harvest_arxiv_oai.py then scripts/build_corpus.py.
  papers: data/corpus_v3/papers.jsonl
  chunks: data/corpus_v3/chunks.jsonl
  pdf_cache: cache/arxiv/pdf
  text_cache: cache/arxiv/text
  index_cache: cache/ml_v3
  feedback_db: results/ml_feedback.db
  upload_dir: cache/uploads

# Where the corpus above comes from when it is not on disk (a fresh container).
# It is too big for a free Space's own repo (1 GB), so it lives in a public
# dataset repo and is downloaded once per start. If that fails, the app falls
# back to the small corpus bundled with the Space rather than refusing to boot.
corpus:
  repo: Kagzy/researchos-corpus
  fallback:
    papers: data/arxiv_papers.jsonl
    chunks: data/arxiv_chunks.jsonl
    index_cache: cache/ml

# v2: structured failure diagnosis (CRITIC-R1 format) when the confidence gate
# fires and nothing rescues the query. Fires only on low-confidence results.
diagnosis:
  enabled: true
  # Tried in order; a quota 429 moves to the next. Each model has its own
  # daily token cap on Groq's free tier, so two models ~double capacity.
  # 120b first: answers already spend the 20b budget, and a diagnosis
  # (which fires on most vague queries) must never starve them. 20b is
  # the fallback only. 120b is what scripts/eval_v2_rescue.py measures.
  models: [openai/gpt-oss-120b, openai/gpt-oss-20b]
  budget_s: 6.0             # hard wall-clock cap; past it, v1 behaviour
