# Stage 2: rerank the fused top-50 with the untrained bge-reranker-base. Row 3.
seed: 42
row_id: offshelf_reranker

dataset:
  name: scifact
  url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/scifact.zip
  split: test
  download_dir: datasets

reranker:
  model: BAAI/bge-reranker-base
  params: 110M
  max_length: 384
  batch_size: 32
  fp16: true
  backend: torch

rerank:
  top_k: 50

eval:
  k_values: [1, 5, 10, 50, 100]

paths:
  cache_dir: cache
  results: results/metrics.json
  fused_run: cache/run_rrf_test.json
