# Stage 4 eval: rerank with the model fine-tuned on RANDOM negatives. Row 4.
seed: 42
row_id: finetuned_random_negatives

dataset:
  name: scifact
  url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/scifact.zip
  split: test
  download_dir: datasets

reranker:
  model: models/reranker-random/final
  params: 110M
  max_length: 384
  batch_size: 32
  fp16: true
  backend: torch

rerank:
  top_k: 50

eval:
  k_values: [1, 5, 10, 50, 100]

paths:
  cache_dir: cache
  results: results/metrics.json
  fused_run: cache/run_rrf_test.json
